name: Purge jsDelivr cache

on:
  push:
    branches: [ "main" ]
    paths:
      - "dist/**"

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge dist files
        run: |
          curl -sS "https://purge.jsdelivr.net/gh/ryoga-coder/kintone-stock@main/dist/app.js" > /dev/null
          curl -sS "https://purge.jsdelivr.net/gh/ryoga-coder/kintone-stock@main/dist/feature_ship_summary_view.js" > /dev/null
          curl -sS "https://purge.jsdelivr.net/gh/ryoga-coder/kintone-stock@main/dist/feature_ui_hide_shipping_on_in.js" > /dev/null
